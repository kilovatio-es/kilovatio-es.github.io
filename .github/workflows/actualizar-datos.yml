name: Actualizar precios de la energía

on:
  schedule:
    # Horas en UTC. 23:10 = inicio del día en España; 19:40 y 20:40 = precios de mañana; 06:30 = carburantes.
    - cron: "10 23 * * *"
    - cron: "30 6 * * *"
    - cron: "40 19 * * *"
    - cron: "40 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar precios
        run: python scripts/update_data.py
      - name: Guardar cambios
        run: |
          git config user.name "kilovatio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/energia.json
          git diff --cached --quiet || (git commit -m "Actualizar precios $(date -u +%Y-%m-%dT%H:%M)" && git push)
